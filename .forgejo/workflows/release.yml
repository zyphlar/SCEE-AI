name: Release Debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v163.0-beta2)'
        required: true
        default: 'v163.0-beta2'
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: codeberg-medium
    container:
      image: codeberg.org/comaps/docker-android-sdk:ubuntu-standalone-sha-8667ed0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Create release and upload APK
        env:
          TAG: ${{ github.event.inputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(curl -sf -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"SCEE-AI $TAG\",\"draft\":false,\"prerelease\":$PRERELEASE}")

          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          curl -sf -X POST \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SCEE-AI-debug.apk" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app/build/outputs/apk/debug/app-debug.apk
