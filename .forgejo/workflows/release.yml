name: Release Debug APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v163.0-beta2)'
        required: true
        default: 'v163.0-beta2'
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: codeberg-medium

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-36

      - name: Install Android SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools ~/android-sdk/cmdline-tools/latest
          (yes || true) | ~/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          ~/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Xmx2500m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          printf '\nkotlin.compiler.execution.strategy=in-process\n' >> gradle.properties
          ./gradlew assembleDebug --no-daemon

      - name: Create release and upload APK
        env:
          TAG: ${{ github.event.inputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(curl -sf -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"SCEE-AI $TAG\",\"draft\":false,\"prerelease\":$PRERELEASE}")

          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          curl -sf -X POST \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SCEE-AI-debug.apk" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @app/build/outputs/apk/debug/app-debug.apk
